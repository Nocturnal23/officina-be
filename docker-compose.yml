services:
  postgres:
    image: postgres:16-alpine
    container_name: officina_db_container
    restart: unless-stopped
    environment:
      POSTGRES_DB: officina_db
      POSTGRES_USER: ${DB_USER:?Imposta DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Imposta DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: