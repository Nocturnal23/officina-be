server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/officina_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  application:
    name: officina-be

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 28800000

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
    org.springframework.web: DEBUG