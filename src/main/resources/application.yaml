server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/officina_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  application:
    name: officina-be

  jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      open-in-view: false